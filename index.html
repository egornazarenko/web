<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Попадание точки в область — Вариант</title>
<style>

  /*Базовые настройки, наследование шрифта и цвета*/
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Verdana, Arial, sans-serif; /* задано на body -> наследуется всеми потомками */
    color: #040e20;                                       /* цвет тоже наследуется */
    background: #f4f3f3;
    line-height: 1.4;
  }

  /*Шапка страницы: явно заданный шрифт fantasy, цвет, размер*/
  .page-header {
    background: #1c581a;
    padding: 18px 30px;
  }

  .page-header .header-line {
    margin: 2px 0;
    font-family: fantasy;   /* явно заданный шрифт по требованию */
    font-size: 20px;        /* явно заданный размер */
    color: #f4d9b8;         /* явно заданный цвет */
  }

  /* Селектор псевдоэлемента: декоративная плашка перед первой строкой шапки */
  .page-header .header-line:first-child::before {
    content: "$ ";
    color: #d97a3f;
  }

  .page-header .value {
    color: #ffffff; /* переопределяет унаследованный цвет для конкретного элемента (каскад) */
    font-weight: bold;
  }

  /*Общая раскладка блоками (без таблиц для верстки)*/
  .content {
    margin: 12px 0 0 0;
    padding: 0 12px;
    overflow: hidden; /* охватывает float-дочерние элементы */
  }

  .panel {
    background: #ffffff;
    border: 1px solid #d5dde3;
    border-radius: 4px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  /* Селектор дочерних элементов: заголовок панели только прямой потомок .panel */
  .panel > h2 {
    margin-top: 0;
    font-size: 18px;
    color: #7dcc8b;
    padding-bottom: 8px;
  }


  .form-panel {
    float: left;
    width: 40%;
  }

  .canvas-panel {
    float: right;
    width: 58%;
    text-align: center;
  }

  .results-panel {
    clear: both;
  }

  /* Форма*/
  .field {
    margin-bottom: 18px;
  }

  .field > label {
    display: block;
    font-weight: bold;
    margin-bottom: 6px;
    color: #21e21e;
  }

  /* Наследование: .hint не задаёт свой font-family, использует унаследованный от body */
  .hint {
    display: block;
    font-size: 12px;
    color: #66727d;
    margin-top: 4px;
  }

  .error-msg {
    display: block;
    font-size: 12px;
    color: #c0392b;
    min-height: 14px;
    margin-top: 4px;
  }

  input[type="text"] {
    width: 100%;
    padding: 8px 10px;      /* отступы полей ввода заданы в пикселях */
    border: 1px solid #b7c2ca;
    border-radius: 3px;
    font-size: 15px;
    font-family: inherit;   /* явное подтверждение наследования шрифта */
  }

  /* Псевдокласс :focus */
  input[type="text"]:focus {
    outline: none;
    border-color: #1b3a53;
    box-shadow: 0 0 0 2px rgba(27, 58, 83, 0.15);
  }

  /* Псевдокласс :invalid - подсветка некорректного значения */
  input[type="text"]:invalid {
    border-color: #c0392b;
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* Селектор дочерних элементов: только кнопки внутри .btn-group */
  .btn-group > button {
    padding: 8px 12px;      /* отступы элементов ввода в пикселях */
    border: 1px solid #b7c2ca;
    background: #f4f6f8;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: #21e21e;
  }

  /* Каскадирование: общее правило для кнопок ниже переопределяет некоторые
     свойства из .btn-group > button благодаря более позднему порядку и
     одинаковой специфичности класса */
  .opt-btn:hover {
    background: #e3e8ec;
  }

  .opt-btn:active {
    transform: translateY(1px);
  }

  .opt-btn.active {
    background: #643f0b;
    border-color: #643f0b;
    color: #ffffff;
  }

  /* Общее правило для всех кнопок */
  button {
    font-family: inherit;
  }

  /* Более специфичное правило .submit-btn переопределяет общее правило button
     выше по каскаду (пример каскадирования) */
  .submit-btn {
    margin-top: 6px;
    padding: 10px 22px;
    background: #643f0b;
    color: #ffffff;
    border: none;
    border-radius: 3px;
    font-size: 15px;
    cursor: pointer;
  }

  .submit-btn:hover {
    background: #da8918;
  }

  .submit-btn:disabled {
    background: #c9b2a0;
    cursor: not-allowed;
  }


  #area-canvas {
    max-width: 100%;
    border: 1px solid #d5dde3;
    background: #ffffff;
  }

  /*Таблица результатов*/
  table {
    width: 100%;
    border-collapse: collapse;
    font-family: "Consolas", "Courier New", monospace; /* переопределяет шрифт body только для таблицы */
    font-size: 13px;
  }

  table > thead > tr > th {
    background: #643f0b;
    color: #ffffff;
    padding: 8px 6px;
    text-align: left;
  }


  /* Псевдокласс :nth-child - зебра-раскраска строк */
  #results-body tr:nth-child(even) {
    background: #f4f6f8;
  }

  #results-body tr:hover {
    background: #eef2f5;
  }

  .hit-yes {
    color: #1c7a3e;
    font-weight: bold;
  }

  .hit-no {
    color: #c0392b;
    font-weight: bold;
  }

  #clear-btn {
    margin-top: 12px;
    padding: 8px 16px;
    background: #ffffff;
    border: 1px solid #b7c2ca;
    border-radius: 3px;
    cursor: pointer;
  }

  #clear-btn:hover {
    background: #f4f6f8;
  }

  .empty-row td {
    text-align: center;
    color: #8a97a1;
    font-style: italic;
  }

  @media (max-width: 720px) {
    .form-panel, .canvas-panel {
      float: none;
      width: 100%;
    }
  }
</style>
</head>
<body>

<header class="page-header">
  <p class="header-line">ФИО: <span class="value">Назаренко Егор Сергеевич</span></p>
  <p class="header-line">Группа: <span class="value">Р3208</span></p>
  <p class="header-line">Вариант: <span class="value">12636</span></p>
</header>

<main class="content">

  <section class="panel form-panel">
    <h2>Проверка точки</h2>
    <form id="check-form" novalidate>

      <div class="field">
        <label for="x-input">X</label>
        <input type="text" id="x-input" name="x" placeholder="от -5 до 5" autocomplete="off" inputmode="decimal">
        <span class="hint">Допустимые значения: от -5 до 5</span>
        <span class="error-msg" id="x-error"></span>
      </div>

      <div class="field">
        <label>Y</label>
        <div class="btn-group" id="y-group"></div>
        <span class="error-msg" id="y-error"></span>
      </div>

      <div class="field">
        <label>R</label>
        <div class="btn-group" id="r-group"></div>
        <span class="error-msg" id="r-error"></span>
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">Проверить</button>
    </form>
  </section>

  <section class="panel canvas-panel">
    <h2>Область (вариант)</h2>
    <canvas id="area-canvas" width="420" height="420"></canvas>
  </section>

</main>

<div class="content">
  <section class="panel results-panel">
    <h2>Результаты проверок</h2>
    <table id="results-table">
      <thead>
        <tr>
          <th>№</th>
          <th>X</th>
          <th>Y</th>
          <th>R</th>
          <th>Результат</th>
          <th>Дата и время</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
    <button type="button" id="clear-btn">Очистить историю</button>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
